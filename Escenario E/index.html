<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<!-- Indica que el archivo JavaScript es un módulo.
     Los módulos permiten organizar JavaScript en diferentes archivos y utilizar:
     import y export 
     Además, los módulos tienen un comportamiento de carga parecido a 
     defer: no bloquean el análisis del HTML y se ejecutan después de que el documento haya sido analizado. -->
     <script type="module" src="script1.js"></script>
     <script type="module" src="script2.js"></script>
     <script type="module" src="script3.js"></script>
</head>
<body>
    <h1 id="titulo">Hola</h1>
</body>
</html>
